services:
  app:
    container_name: code-dojo-app-ci
    environment:
      FLASK_DEBUG: "False"
      FLASK_SECRET_KEY: ci-test-secret-key
      DATABASE_URL: sqlite:///code_dojo.db
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-test-key}
      LANGCHAIN_TRACING_V2: "false"
    # No volumes - ephemeral for CI
    volumes: []
    command: >
      sh -c "
        echo 'Initializing database for CI...' &&
        python3 seed_data.py --smart &&
        echo 'Starting Flask application...' &&
        python3 app.py
      "
