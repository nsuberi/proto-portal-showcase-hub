name: Claude Code Review

on:
  push:
    branches: [main]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::671388079324:role/github-actions-anthropic-reader
          aws-region: us-east-1

      - name: Fetch Anthropic API key from Secrets Manager
        run: |
          KEY=$(aws secretsmanager get-secret-value \
            --secret-id portfolio-prod/anthropic-api-key \
            --region us-east-1 \
            --query SecretString --output text)
          echo "::add-mask::$KEY"
          echo "ANTHROPIC_API_KEY=$KEY" >> $GITHUB_ENV

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

