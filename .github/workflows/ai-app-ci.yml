name: AI Application CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/ai-evals-in-context/**'
      - '.github/workflows/ai-app-ci.yml'

jobs:
  test:
    name: AI Evals — container test
    runs-on: ubuntu-24.04-arm # ARM64 runner — matches ECS Fargate Graviton architecture
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC: pull Anthropic key from Secrets Manager

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::671388079324:role/terraform-cooking-up-ideas
          aws-region: us-east-1

      - name: Fetch Anthropic API key from Secrets Manager
        working-directory: ./apps/ai-evals-in-context/ai-testing-resource
        run: |
          ANTHROPIC_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id portfolio-prod/anthropic-api-key \
            --region us-east-1 \
            --query SecretString --output text)
          # Mask in CI logs
          echo "::add-mask::$ANTHROPIC_API_KEY"
          cp .env.docker .env
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env

      - name: Build Docker images
        working-directory: ./apps/ai-evals-in-context/ai-testing-resource
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Start Docker Compose services
        working-directory: ./apps/ai-evals-in-context/ai-testing-resource
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Show initial container logs
        if: always()
        working-directory: ./apps/ai-evals-in-context/ai-testing-resource
        run: |
          echo "=== Container Status ==="
          docker compose ps
          echo ""
          echo "=== API Container Logs (last 100 lines) ==="
          sleep 10
          docker compose logs --tail=100 api || true

      - name: Wait for services to be healthy
        working-directory: ./apps/ai-evals-in-context/ai-testing-resource
        run: |
          echo "Waiting for all services to be healthy..."
          timeout 120 bash -c 'until [ $(docker compose ps --format json | jq -r "select(.Health == \"healthy\") | .Name" | wc -l) -eq 3 ]; do echo "Waiting for all 3 services to be healthy..."; docker compose ps; sleep 5; done'
          echo "All services are healthy!"
          docker compose ps

      - name: Run pytest in API container
        working-directory: ./apps/ai-evals-in-context/ai-testing-resource
        run: |
          docker compose exec -T api pytest tests/ \
            --junitxml=results/test-results.xml \
            -v \
            --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: apps/ai-evals-in-context/ai-testing-resource/results/*.xml
          retention-days: 7

      - name: Cleanup
        if: always()
        working-directory: ./apps/ai-evals-in-context/ai-testing-resource
        run: docker compose down -v
